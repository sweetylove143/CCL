<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3 Static Site - News Lab</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        header {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        .subtitle {
            margin: 0;
            color: #555;
        }

        nav {
            margin-top: 12px;
        }

        nav a {
            margin-right: 12px;
            color: #1a73e8;
            text-decoration: none;
        }

        section {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px 20px;
            margin-top: 20px;
        }

        ul {
            margin: 0;
            padding-left: 18px;
        }

        footer {
            text-align: center;
            margin-top: 28px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <h1>Blue Tide Newsroom</h1>
            <p class="subtitle">Simple static page for AWS S3 hosting.</p>
        </header>

        <section id="features">
            <h2>Features</h2>
            <ul>
                <li>Single HTML file</li>
                <li>Clean layout</li>
                <li>Fast to upload and demo</li>
            </ul>
        </section>

        <section id="steps">
            <h2>Host on S3 in 3 steps</h2>
            <ol>
                <li>Create a bucket and enable static website hosting.</li>
                <li>Upload this index.html file.</li>
                <li>Open the website endpoint URL.</li>
            </ol>
        </section>
    </main>
</body>

</html>
